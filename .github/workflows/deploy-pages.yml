name: Deploy Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm@11 requires Node >=22.13 — Node 20 fails at pnpm startup
          # (ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @numosai/playgrounds build
        env:
          BASE_PATH: /design-system/

      - run: pnpm --filter @numosai/demo build
        env:
          BASE_PATH: /design-system/demo/

      - run: pnpm --filter @numosai/storybook build

      # One Pages site, three apps: playgrounds at the root (unchanged URL),
      # storybook and demo nested under their own subpaths.
      - run: |
          mkdir -p site
          cp -r apps/playgrounds/dist/. site/
          mkdir -p site/demo
          cp -r apps/demo/dist/. site/demo/
          mkdir -p site/storybook
          cp -r apps/storybook/storybook-static/. site/storybook/

      - uses: actions/configure-pages@v5
        with:
          # Pages has never been turned on for this repo (Settings > Pages);
          # v5 defaults to enablement:false and just fails checking for a
          # site that doesn't exist yet. This has the action create/enable
          # it itself via the API, using this workflow's own token.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
